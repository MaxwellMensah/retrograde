name: "Retrograde - Validate and Deploy"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  validate-python:
    name: "Lint & Check Python"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          pip install flake8

      - name: Lint with flake8
        run: |
          flake8 . --extend-exclude=venv,.venv,.venv311,.terraform --count --select=E9,F63,F7,F82 --show-source --statistics

  validate-terraform:
    name: "Validate Terraform"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend=false -input=false

      - name: Terraform Format
        run: terraform fmt -check -diff -recursive

      - name: Terraform Validate
        run: terraform validate

  deploy:
    name: "Deploy to AWS S3 & Refresh ASG"
    needs: [validate-python, validate-terraform]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: retrograde-ec2-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload Application Files to S3
        run: |
          set -euo pipefail
          
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION="${AWS_REGION:-us-east-1}"
          S3_BUCKET="retrograde-static-assets-${ACCOUNT_ID}-${REGION}"
          
          echo "Using dynamically constructed S3 bucket: $S3_BUCKET"
          
          aws s3 cp app.py s3://$S3_BUCKET/app/app.py
          aws s3 cp requirements.txt s3://$S3_BUCKET/app/requirements.txt
          aws s3 sync templates/ s3://$S3_BUCKET/app/templates/
          aws s3 sync static/ s3://$S3_BUCKET/static/
          aws s3 sync images/ s3://$S3_BUCKET/images/

      - name: Trigger Auto Scaling Group Instance Refresh
        run: |
          set -euo pipefail
          
          # Automatically discover the timestamped ASG name starting with 'retrograde-asg'
          ASG_NAME=$(aws autoscaling describe-auto-scaling-groups --query "AutoScalingGroups[?starts_with(AutoScalingGroupName, 'retrograde-asg')].AutoScalingGroupName | [0]" --output text)
          
          if [ -z "$ASG_NAME" ] || [ "$ASG_NAME" == "None" ]; then
            echo "Error: Could not automatically locate the Auto Scaling Group."
            exit 1
          fi
          
          echo "Successfully discovered ASG: $ASG_NAME"
          
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 300}'